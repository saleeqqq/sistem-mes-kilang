<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Login - Sistem Operasi Kilang</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #e9ecef; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: white; padding: 40px 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        .logo-placeholder { font-size: 50px; margin-bottom: 10px; }
        .login-card h2 { margin: 0 0 5px 0; color: #333; font-size: 22px; }
        .login-card p { color: #777; font-size: 14px; margin-bottom: 25px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; transition: 0.3s; }
        .btn-login { width: 100%; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .error-msg { color: #ff3366; font-size: 13px; margin-top: 10px; display: none; font-weight: bold; background: #ffe6eb; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-placeholder">🏭</div>
        <h2>Portal Sistem MES</h2>
        <p>Sila log masuk untuk mula bertugas</p>

        <div class="form-group">
            <label>ID Pengguna</label>
            <input type="text" id="username" placeholder="Cth: ENG01 atau OP101" autocomplete="off">
        </div>

        <div class="form-group">
            <label>Kata Laluan</label>
            <input type="password" id="password" placeholder="Masukkan kata laluan">
        </div>

        <button class="btn-login" onclick="semakLogin()">LOG MASUK</button>
        <div class="error-msg" id="errorMsg">❌ ID Pengguna atau Kata Laluan salah!</div>
    </div>

    <!-- PANGGIL FAIL DATABASE PEKERJA KITA -->
    <script src="data_pekerja.js"></script>

    <script>
        function semakLogin() {
            let user = document.getElementById("username").value.trim().toUpperCase(); 
            let pass = document.getElementById("password").value;
            let errorMsg = document.getElementById("errorMsg");
            errorMsg.style.display = "none";

            if (typeof senaraiPekerja === 'undefined') {
                alert("Ralat Sistem: Fail data_pekerja.js tidak dijumpai!"); return;
            }

            if (senaraiPekerja[user] && senaraiPekerja[user].pass === pass) {
                let dataPekerja = senaraiPekerja[user];

                // SIMPAN NAMA & ID DALAM MEMORI TELEFON (LOCAL STORAGE)
                localStorage.setItem("mes_username", user);
                localStorage.setItem("mes_nama", dataPekerja.nama);
                localStorage.setItem("mes_role", dataPekerja.role);

                if (dataPekerja.role === "manager") {
                    window.location.href = "menu_manager.html"; 
                } else if (dataPekerja.role === "operator") {
                    window.location.href = "terminal_operator.html";
                }
            } else {
                errorMsg.style.display = "block";
            }
        }
    </script>
</body>
</html>
