    <style>
        :root {
            /* Theme Colors */
            --bg-dark: #070b14;
            --bg-surface: #131b2c;
            --bg-card: rgba(15, 23, 42, 0.8);
            
            /* Typography */
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            /* Accent & Status */
            --accent-cyan: #0ea5e9;
            --status-online: #10b981; /* Green */
            --status-warning: #f59e0b; /* Amber/Orange */
            --status-error: #ef4444; /* Red */
            --status-neutral: #3b82f6; /* Blue */
            
            /* Borders & Effects */
            --border-light: rgba(148, 163, 184, 0.2);
            --border-focus: rgba(14, 165, 233, 0.5);
            --shadow-card: 0 8px 25px rgba(0, 0, 0, 0.4);
            --glow-cyan: 0 0 15px rgba(14, 165, 233, 0.2);
            
            --transition-smooth: all 0.2s ease-out;
            --touch-target: 48px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 15px;
            /* Industrial Background */
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(14, 165, 233, 0.1), transparent 50%),
                linear-gradient(var(--border-light) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-light) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            background-attachment: fixed;
        }

        .mes-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: fadeIn 0.4s ease-out;
            margin-bottom: 30px;
        }

        /* --- HEADER & PROFILE --- */
        .op-header {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-card);
        }

        .header-brand {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }

        .brand-subtitle {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sys-status {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .status-indicator {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--status-online);
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 8px;
            border-radius: 12px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-dot {
            width: 6px; height: 6px;
            background-color: var(--status-online);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .sys-clock {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .op-profile {
            background: linear-gradient(145deg, var(--bg-surface), rgba(14, 165, 233, 0.05));
            border: 1px solid var(--border-light);
            border-left: 4px solid var(--accent-cyan);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .op-avatar {
            width: 45px; height: 45px;
            background: rgba(14, 165, 233, 0.15);
            color: var(--accent-cyan);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
        }

        .op-info { display: flex; flex-direction: column; gap: 3px; flex-grow: 1; }
        
        .op-label { font-size: 0.65rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
        
        .op-name { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); }

        /* Hidden Original ID Input (Retained for logic) */
        #idInput { display: none; }

        /* --- CARDS & FORMS --- */
        .mes-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: var(--shadow-card);
        }

        .card-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
