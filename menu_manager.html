<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Pengurusan - Sistem MES</title>
    <!-- Font Awesome for industrial-grade icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for better typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Enterprise Color Palette */
            --mes-bg-dark: #090e17;
            --mes-surface-main: #131b2c;
            --mes-surface-card: #172136;
            --mes-surface-hover: #1e2a45;
            
            /* Typography Colors */
            --mes-text-primary: #f1f5f9;
            --mes-text-secondary: #94a3b8;
            --mes-text-muted: #64748b;
            
            /* Status & Accent Colors */
            --mes-accent-primary: #0ea5e9; /* Light Blue */
            --mes-status-online: #10b981; /* Emerald Green */
            --mes-status-warning: #f59e0b; /* Amber */
            
            /* Border & Effects */
            --mes-border-light: rgba(148, 163, 184, 0.1);
            --mes-border-focus: rgba(14, 165, 233, 0.3);
            --mes-shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.2);
            --mes-shadow-glow: 0 0 15px rgba(14, 165, 233, 0.15);
            
            /* Transitions */
            --transition-smooth: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--mes-bg-dark);
            color: var(--mes-text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle grid background for industrial feel */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--mes-border-light) 1px, transparent 1px),
                linear-gradient(90deg, var(--mes-border-light) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3;
            z-index: -1;
            pointer-events: none;
        }

        /* Soft central glow */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80vw;
            height: 50vh;
            background: radial-gradient(ellipse at top, rgba(14, 165, 233, 0.05), transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .layout-container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            gap: 2rem;
        }

        /* --- HEADER SECTION --- */
        .mes-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--mes-border-light);
            animation: fadeDown 0.5s ease-out;
        }

        .header-brand {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .brand-subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--mes-accent-primary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 500;
        }

        .brand-title {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-title i {
            color: var(--mes-text-secondary);
            font-size: 1.5rem;
        }

        .header-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.5rem;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 0.35rem 0.75rem;
            border-radius: 4px; /* More industrial square look */
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--mes-status-online);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--mes-status-online);
        }

        .status-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--mes-status-online);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .system-clock {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--mes-text-secondary);
        }

        /* --- MODULES GRID --- */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            animation: fadeUp 0.6s ease-out 0.1s backwards;
        }

        .module-card {
            background-color: var(--mes-surface-card);
            border: 1px solid var(--mes-border-light);
            border-radius: 8px; /* Professional slight roundness */
            padding: 2rem;
            text-decoration: none;
            color: var(--mes-text-primary);
            display: flex;
